<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LOUISMP3</title>
  <style>
@media screen and (max-width: 768px) {
  header {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    padding: 10px 20px;
    justify-content: space-between;
  }

  .mobile-divider {
    display: none;
    border: none;
    border-top: none;
    width: 100vw;
    margin: 4px 0;
    position: static;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0.9;
  }

  .logo-container {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: auto;
  }

  .logo {
    font-size: 2.3em;
    font-family: 'Milling Trial Triplex 2,5mm', sans-serif !important;
    margin-right: 20px;
    flex-shrink: 0;
  }

  .subtitle {
    font-size: 0.12em;
    font-weight: 300;
    letter-spacing: -0.25px;
    text-transform: uppercase;
    margin-top: 0;
    margin-left: -4px;
    padding-left: 0;
    transform: translateY(-2px);
  }

  nav {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    padding-left: 10px;
    margin-left: 0;
    height: 100%;
    font-size: 0.6em;
    opacity: 0.9;
    position: relative;
    z-index: 9999;
    gap: 0 !important;
  }

  .dropdown {
    position: relative;
    overflow: visible;
    z-index: 9999;
    align-self: flex-start;
  }

  nav > a,
  nav > div.dropdown {
    padding-left: 0;
    margin-left: 0;
    width: 100%;
    text-align: right;
    margin-bottom: 4px;
  }

  .dropdown > a {
    padding-left: 0;
  }

  .dropdown,
  nav > a {
    width: auto;
  }

  .dropdown-content {
    position: absolute;
    display: none;
    background-color: #F5F5F5;
    width: max-content;
    min-width: 100vw;
    padding: 10px 0;
    border-top: none;
    animation: dropdownFadeSlide 0.3s ease forwards;
    top: 100%;
    right: 0;
    left: auto;
    transform-origin: top;
  }

  .side-text {
    position: static;
    width: auto;
    max-width: 80%;
    font-size: 0.9em;
    text-align: center;
    margin: 10px 0 0 0;
    pointer-events: auto;
    user-select: text;
  }

  .side-text.left,
  .side-text.right {
    margin-bottom: 10px;
    margin-top: 10px;
    left: auto;
    right: auto;
    top: auto;
  }

  main {
    padding-top: 160px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .side-text.left {
    order: -2;
    margin-top: -10px;
  }

  .side-text.right {
    order: -1;
    margin-bottom: 40px;
  }

  .dropdown.open .dropdown-content {
    display: block;
    opacity: 1;
    visibility: visible;
    transform: scaleY(1);
  }

  .dropdown-content a {
    transform: none !important;
    opacity: 1 !important;
    transition: none;
    padding: 10px 20px;
    font-size: 1.3em;
    display: block;
  }

  .dropdown-toggle {
    display: inline-block;
    position: relative;
    width: 100%;
    transition: transform 0.3s ease;
    cursor: pointer;
    z-index: 10000;
  }

  .dropdown.open .dropdown-toggle {
    position: fixed;
    top: 10px;
    left: 0;
    width: 100vw;
    background-color: #F5F5F5;
    padding: 10px 20px;
    z-index: 10000;
  }

  @keyframes dropdownFadeSlide {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  body.dropdown-mode header > .logo-container,
  body.dropdown-mode nav > .dropdown:not(.open),
  body.dropdown-mode nav > a,
  body.dropdown-mode main {
    display: none !important;
  }

  body.dropdown-mode .other-projects {
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
    z-index: -1 !important;
    position: relative !important;
  }

  .video-wrapper {
    width: 105% !important;
    max-width: 105% !important;
    margin-left: -10px;
    margin-right: -10px;
  }

  video {
    width: 100% !important;
    height: auto !important;
    object-fit: cover;
  }

  body.dropdown-other.other-projects {
    display: none !important;
  }
}

.carousel {
  position: relative;
  width: 100%;
  max-width: 100%;
  margin: -140px auto 40px;
  height: 500px;
  perspective: 1000px;
}

.carousel-card {
  position: absolute;
  top: 0; left: 50%;
  width: 100%;
  height: 100%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.6s ease, z-index 0.6s ease;
}

.carousel-card video {
  width: 100%; height: 100%;
  object-fit: cover;
  border-radius: 8px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  pointer-events: auto;
  cursor: pointer;
  transition: transform 0.6s ease, opacity 0.6s ease;
  opacity: 0;
}

.carousel-card.active { transform: translateX(-50%) translateY(0) scale(1); z-index: 3; }
.carousel-card.middle { transform: translateX(-50%) translateY(30px) scale(0.97); z-index: 2; }
.carousel-card.last { transform: translateX(-50%) translateY(60px) scale(0.94); z-index: 1; }
.carousel-card.active video { opacity: 1; }
.carousel-card.middle video { opacity: 0.8; }
.carousel-card.last video { opacity: 0.2; }

.play-button {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 60px; height: 60px;
  background: transparent;
  border: none;
  cursor: pointer;
  z-index: 10;
}
.play-button::before {
  content: '';
  display: block;
  width: 0; height: 0; margin: auto;
  border-style: solid;
  border-width: 15px 0 15px 30px;
  border-color: transparent transparent transparent var(--play-button-color);
}
</style>
</head>
<body>
  <header>
    <!-- ton header ici -->
  </header>
  <main>
<div class="carousel fade-in">
  <div class="carousel-card active">
    <video playsinline poster="nike2.jpg"><source src="ta-video.mp4" type="video/mp4"></video>
    <button class="play-button"></button>
  </div>
  <div class="carousel-card middle">
    <video playsinline poster="pink2.png"><source src="pink.mp4" type="video/mp4"></video>
    <button class="play-button"></button>
  </div>
  <div class="carousel-card last">
    <video playsinline poster="diane.jpg"><source src="dianev-look.mp4" type="video/mp4"></video>
    <button class="play-button"></button>
  </div>
  <div class="carousel-card">
    <video playsinline poster="nl.jpg"><source src="nothing-left.mp4" type="video/mp4"></video>
    <button class="play-button"></button>
  </div>
  <div class="carousel-card">
    <video playsinline poster="j42.jpg"><source src="J4spar.mp4" type="video/mp4"></video>
    <button class="play-button"></button>
  </div>
  <div class="carousel-card">
    <video playsinline poster="dance-now.jpg"><source src="dance-now.mp4" type="video/mp4"></video>
    <button class="play-button"></button>
  </div>
</div>
<script>
const cards = document.querySelectorAll('.carousel-card');
let index = 0;

function updateCarousel() {
  const len = cards.length;
  cards.forEach((card,i) => {
    card.classList.remove('active','middle','last');
    const rel = (i - index + len) % len;
    if(rel === 0) card.classList.add('active');
    else if(rel === 1) card.classList.add('middle');
    else if(rel === 2) card.classList.add('last');
  });
}

// Scroll vertical
let lastWheel = 0;
const cooldown = 500;
document.querySelector('.carousel').addEventListener('wheel', e => {
  e.preventDefault();
  const now = Date.now();
  if(now - lastWheel < cooldown) return;
  lastWheel = now;

  index = e.deltaY > 0 ? (index + 1) % cards.length : (index - 1 + cards.length) % cards.length;
  updateCarousel();
}, {passive:false});

// Play button functionality
cards.forEach(card => {
  const video = card.querySelector('video');
  const btn = card.querySelector('.play-button');
  btn.addEventListener('click', () => { video.play(); btn.style.display='none'; });
  video.addEventListener('click', () => {
    if(video.paused) video.play();
    else video.pause();
    btn.style.display = video.paused ? 'block' : 'none';
  });
  video.addEventListener('ended', () => { btn.style.display='block'; });
});

updateCarousel();
</script>
</body>
</html>
