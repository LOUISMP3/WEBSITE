<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Test Exposure Font</title>
  <style>
    nav > .dropdown:nth-child(1) > .dropdown-toggle { opacity: 1.0 !important; }
    nav > .dropdown:nth-child(2) > .dropdown-toggle { opacity: 0.85 !important; }
    nav > .dropdown:nth-child(3) > .dropdown-toggle { opacity: 0.7 !important; }
    nav > .dropdown:nth-child(4) > .dropdown-toggle { opacity: 0.55 !important; }
    nav > a:last-child                               { opacity: 1.0 !important; }
    nav > .dropdown:nth-child(1) > .dropdown-toggle:hover,
    nav > .dropdown:nth-child(2) > .dropdown-toggle:hover,
    nav > .dropdown:nth-child(3) > .dropdown-toggle:hover,
    nav > .dropdown:nth-child(4) > .dropdown-toggle:hover { opacity: 1.0 !important; }
  </style>

  <style>
/* --- Font logo --- */
@font-face {
  font-family: 'MillingTrial-Triplex25mm';
  src: url('fonts/MillingTrial-Triplex25mm.otf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

/* --- Header / Nav --- */
header {
  position: fixed;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 10px 30px;
  background: #F5F5F5;
  z-index: 1000;
}
.logo-container { display: flex; flex-direction: column; line-height: 1; }
.logo {
  font-family: 'MillingTrial-Triplex25mm', sans-serif !important;
  font-size: 4em;
  margin: 0;
  margin-bottom: 3px;
  margin-top: -5px;
  margin-left: -16px;
  color: #121027; /* logo reste coloré */
  transform: scaleX(0.9);
  text-decoration: none;
  display: inline-block;
  letter-spacing: -0.03em;
}
.logo:hover { opacity: 0.8; }

.subtitle {
  font-size: 0.5em;
  font-weight: 300;
  text-transform: uppercase;
  margin-top: 0;
  margin-left: 2px;
  color: #000000;
  letter-spacing: -0.03em;
}

nav > .dropdown:nth-child(2) > .dropdown-toggle {
  opacity: 0.6; /* modifie selon ton goût */
}

nav { display: flex; gap: 30px; align-items: flex-start; }
    nav a { text-decoration: none; color: #000000; font-weight: normal; text-transform: uppercase; cursor: pointer; letter-spacing: -0.03em; position: relative; z-index: 1100; }

    .dropdown { position: relative; }
    .dropdown-content {
      display: block;
      visibility: hidden;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      position: absolute;
      top: 100%;
      left: -20px;
      background-color: #F5F5F5;
      z-index: 1001;
      padding: 10px 0;
      pointer-events: none;
      overflow: visible;
      white-space: nowrap;
    }
    .dropdown:hover .dropdown-content {
      visibility: visible;
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .dropdown-content a, .submenu-toggle {
      display: block;
      padding: 4px 20px;
      color: #000000;
      text-decoration: none;
      font-size: 1em;
      font-weight: bold;
      white-space: nowrap;
      opacity: 0;
      transform: translateX(-15px);
      animation-fill-mode: forwards;
      letter-spacing: -0.03em;
    }
    
    .dropdown:hover .dropdown-content > *:nth-child(1) { animation: slideFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.1s; }
    .dropdown:hover .dropdown-content > *:nth-child(2) { animation: slideFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.2s; }
    .dropdown:hover .dropdown-content > *:nth-child(3) { animation: slideFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.3s; }
    .dropdown:hover .dropdown-content > *:nth-child(4) { animation: slideFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.4s; }
    .dropdown:hover .dropdown-content > *:nth-child(5) { animation: slideFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.5s; }
    .dropdown:hover .dropdown-content > *:nth-child(6) { animation: slideFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.6s; }
    .dropdown:hover .dropdown-content > *:nth-child(7) { animation: slideFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.7s; }
    .dropdown:hover .dropdown-content > *:nth-child(8) { animation: slideFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.8s; }
    .dropdown:hover .dropdown-content > *:nth-child(9) { animation: slideFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.9s; }
    .dropdown:hover .dropdown-content > *:nth-child(10) { animation: slideFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 1.0s; }
    .dropdown:hover .dropdown-content > *:nth-child(11) { animation: slideFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 1.1s; }

    .dropdown:hover .dropdown-content > .submenu:nth-child(1) .submenu-toggle { animation: slideFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.1s; }
    .dropdown:hover .dropdown-content > .submenu:nth-child(2) .submenu-toggle { animation: slideFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.2s; }
    .dropdown:hover .dropdown-content > .submenu:nth-child(3) .submenu-toggle { animation: slideFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.3s; }
    .dropdown:hover .dropdown-content > .submenu:nth-child(4) .submenu-toggle { animation: slideFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.4s; }
    .dropdown:hover .dropdown-content > .submenu:nth-child(5) .submenu-toggle { animation: slideFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.5s; }
    .dropdown:hover .dropdown-content > .submenu:nth-child(6) .submenu-toggle { animation: slideFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.6s; }

    /* --- Submenu (Nested Dropdown) --- */
    .submenu { position: relative; }
    .submenu-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      background-color: transparent;
      padding: 0;
    }
    .submenu:hover .submenu-content { max-height: 200px; }
    .submenu-content a {
      padding: 3px 40px !important;
      font-size: 0.75em !important;
      color: #000000 !important;
      font-weight: normal !important;
      opacity: 0;
      transform: translateX(-15px);
      animation-fill-mode: forwards;
    }
    .submenu:hover .submenu-content a { animation: slideFadeIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
    .submenu:hover .submenu-content a:nth-child(1) { animation-delay: 0.1s; }
    .submenu:hover .submenu-content a:nth-child(2) { animation-delay: 0.25s; }

    @keyframes slideFadeIn { to { opacity: 1; transform: translateX(0); } }
  </style>
  <style>
    @font-face {
      font-family: 'Exposure';
      src: url('fonts/Exposure.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    body {
      margin: 40px;
      font-family: Arial, sans-serif;
    }

    h1 {
      font-family: 'Exposure', sans-serif;
      font-size: 4em;
      color: #0A1E40;
    }
  </style>
</head>
<body>
  <h1>LOUISMP3</h1>
</body>
</html>
