<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prod. by Louis</title>
  <style>
    :root {
      --main-color: #0A1E40;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      color: var(--main-color);
    }

    header {
      padding: 40px 20px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 2.5em;
      margin: 0;
      font-weight: bold;
    }

    main {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      padding: 40px 20px;
    }

    .track-card {
      text-decoration: none;
      color: var(--main-color);
      width: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s ease;
    }

    .track-card:hover {
      transform: translateY(-4px);
    }

    .track-card img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .track-title {
      font-weight: bold;
      font-size: 1em;
      text-align: center;
    }

    .track-artist {
      font-size: 0.9em;
      color: #666;
      text-align: center;
      margin-top: 4px;
    }

    @media(max-width: 600px) {
      .track-card {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Prod. by Louis</h1>
  </header>

  <main>
    <a href="les-filles-sean.html" class="track-card">
      <img src="les-filles.jpg" alt="Les Filles" />
      <div class="track-title">Les Filles</div>
      <div class="track-artist">sean</div>
    </a>

    <a href="qui-va-ecouter-ca.html" class="track-card">
      <img src="qui.jpg" alt="Qui va écouter ça?" />
      <div class="track-title">Qui va écouter ça?</div>
      <div class="track-artist">Elyon</div>
    </a>

    <a href="feuille-shit-clope.html" class="track-card">
      <img src="fsc.jpg" alt="Feuille Shit Clope" />
      <div class="track-title">Feuille Shit Clope</div>
      <div class="track-artist">sean</div>
    </a>

    <a href="introduktion-akkai.html" class="track-card">
      <img src="intro.jpg" alt="Introduktion" />
      <div class="track-title">Introduktion</div>
      <div class="track-artist">Akkai</div>
    </a>

    <a href="nna-affa.html" class="track-card">
      <img src="affa.jpg" alt="N'na" />
      <div class="track-title">N'na</div>
      <div class="track-artist">Affa</div>
    </a>

    <a href="seul-sidi.html" class="track-card">
      <img src="seul.jpg" alt="Seul" />
      <div class="track-title">Seul</div>
      <div class="track-artist">Sidi</div>
    </a>
  </main>

</body>
</html>
