<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>

  <style>
    body {
      font-family: 'Helvetica Neue', sans-serif;
      background-color: #fefefe;
      margin: 0;
      padding: 0;
    }

    .contact {
      max-width: 500px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    .contact h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row input {
      flex: 1;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    textarea {
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      min-height: 100px;
      resize: vertical;
    }

    button {
      background-color: black;
      color: white;
      border: none;
      padding: 10px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #333;
    }

    .social-links {
      margin-top: 30px;
    }

    .social-links a {
      margin: 0 10px;
      text-decoration: none;
      color: black;
      font-weight: bold;
      position: relative;
    }

    .social-links a::after {
      content: '↗';
      margin-left: 4px;
      font-size: 0.8em;
    }

    @media (max-width: 480px) {
      .form-row {
        flex-direction: column;
      }
    }
  </style>
  <link rel="stylesheet" href="header.css?v=2">
</head>
<body>

  <section class="contact">
    <h2>Contact</h2>

    <form action="https://formspree.io/f/your-form-id" method="POST">
      <div class="form-row">
        <input type="text" name="name" placeholder="Name" required>
        <input type="email" name="email" placeholder="Email" required>
      </div>
      <textarea name="message" placeholder="Message" required></textarea>
      <button type="submit">Send</button>
    </form>

    <div class="social-links">
      <a href="https://instagram.com/tonprofil" target="_blank">Instagram</a>
      <a href="https://soundcloud.com/tonprofil" target="_blank">SoundCloud</a>
    </div>
  </section>

</body>
</html>
